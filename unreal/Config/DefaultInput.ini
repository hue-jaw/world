[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bEnableMouseSmoothing=False
FOVScale=0.011110
DoubleClickTime=0.200000

; ---------------------------------------------------------------------------
; MAPPAGES DE SECOURS (legacy axis/action)
;
; Les assets Enhanced Input (IMC_Default, IMC_Driving, IA_*) ne peuvent etre
; crees que dans l'editeur : aucun .uasset n'est versionne. Tant qu'ils
; n'existent pas, le code C++ retombe sur ces mappages (voir
; MetropolisCharacter::SetupPlayerInputComponent, "fallback legacy").
; Resultat : le projet est jouable des la premiere compilation.
;
; Une fois les assets crees dans l'editeur, ils ont la priorite et ces
; mappings peuvent rester : ils ne genent pas.
; ---------------------------------------------------------------------------

+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Down)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="Steer",Scale=-1.000000,Key=A)
