; METROPOLIS utilise Enhanced Input.
; Les Input Actions et Mapping Contexts sont des ASSETS (.uasset) a creer
; dans l'editeur (ils ne peuvent pas etre generes en texte) :
;   /Game/Input/IMC_Player    (contexte a pied)
;   /Game/Input/IMC_Driving   (contexte vehicule, priorite 1)
;   /Game/Input/IA_Move       (Axis2D : ZQSD/WASD + fleches)
;   /Game/Input/IA_Look       (Axis2D : souris)
;   /Game/Input/IA_Jump       (Digital : Espace)
;   /Game/Input/IA_Sprint     (Digital : Maj)
;   /Game/Input/IA_Interact   (Digital : F)
;   /Game/Input/IA_Throttle   (Axis1D : Z / S)
;   /Game/Input/IA_Steering   (Axis1D : Q / D)
;   /Game/Input/IA_Brake      (Axis1D : S quand on avance)
;   /Game/Input/IA_Handbrake  (Digital : Espace)
;   /Game/Input/IA_ExitVehicle (Digital : F)
; Procedure complete et affectations : unreal/README.md, section "Assets a creer".

[/Script/Engine.InputSettings]
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
