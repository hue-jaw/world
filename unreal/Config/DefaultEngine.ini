[/Script/Engine.RendererSettings]
; --- Rendu : Lumen, Nanite, ombres virtuelles -----------------------------
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Nanite=1
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.MotionBlur=0
r.DefaultFeature.Bloom=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True

; Ray tracing matériel OPTIONNEL (activé par le menu Graphismes).
; Laisser à 0 par défaut : la RTX 3050 6 Go ne tient pas 1080p/60 en RT complet.
r.RayTracing=0
r.RayTracing.Shadows=0
r.RayTracing.Reflections=0

; Budget VRAM (cible : 6 Go)
r.Streaming.PoolSize=3500
r.Streaming.LimitPoolSizeToVRAM=1
r.TextureStreaming=1

; Ombres : cohérence avec les presets du jeu
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=2048

[/Script/Engine.PhysicsSettings]
