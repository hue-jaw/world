[/Script/Engine.RendererSettings]
; Eclairage global dynamique + reflexions Lumen (ville jour/nuit sans baking)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Requis pour Lumen en mode logiciel sur les meshes non-Nanite
r.GenerateMeshDistanceFields=True
; Ombres virtuelles (grandes portees urbaines, cache efficace)
r.Shadow.Virtual.Enable=1
; TSR : upscaling temporel (budget GPU des grandes scenes)
r.AntiAliasingMethod=4
r.TSR.History.R11G11B10=1
; Nanite par defaut sur les nouveaux meshes importes
r.Nanite.ProjectEnabled=True

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Metropolis.MetropolisGameMode

[/Script/Engine.Engine]
; Les vehicules et la foule sont physiquement simules par Chaos (defaut UE5)

[SystemSettings]
; Streaming : pool textures consequent pour une ville (ajuster par plateforme)
r.Streaming.PoolSize=2048
