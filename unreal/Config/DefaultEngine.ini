[/Script/EngineSettings.GameMapsSettings]
; Aucune carte n'est versionnee (un .umap ne peut etre cree que par l'editeur).
; Le GameMode construit le quartier de demonstration a l'execution : ouvrir un
; niveau vide dans l'editeur puis Play suffit. Definir GameDefaultMap apres
; avoir enregistre Content/Maps/L_DemoDistrict (Documentation/02_EDITOR_STEPS.md).
GlobalDefaultGameMode=/Script/Metropolis.MetropolisGameMode

[/Script/Engine.RendererSettings]
; --- Rendu : Lumen, Nanite, ombres virtuelles (UE 5.8) ----------------------
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Nanite=1
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.MotionBlur=0
r.DefaultFeature.Bloom=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True

; Ray tracing materiel OPTIONNEL (active par le menu Graphismes).
; 0 par defaut : la RTX 3050 6 Go ne tient pas 1080p en RT complet.
r.RayTracing=0
r.RayTracing.Shadows=0
r.RayTracing.Reflections=0

; Budget VRAM (cible : 6 Go)
r.Streaming.PoolSize=3500
r.Streaming.LimitPoolSizeToVRAM=1
r.TextureStreaming=1

; Ombres : coherence avec les presets du jeu
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=2048

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=4
; Les surfaces franchissables (bordures, terre-pleins) doivent produire une
; reponse PHYSIQUE : pas de mur invisible, pas de collision desactivee.
bEnableEnhancedDeterminism=False

; NOTE : aucun profil de collision personnalise n'est declare ici.
; Les anciens profils "Vehicle" / "StreetSurface" entraient en conflit avec
; les profils du moteur (doublons au demarrage). Le code utilise desormais
; les profils moteur garantis (Vehicle, BlockAll) et regle les reponses
; explicitement dans SetCollisionResponseToChannel (voir StreetSurfaceActor).

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default
AudioSampleRate=48000

[/Script/Engine.UserInterfaceSettings]
RenderFocusRule=Never

[/Script/Engine.Engine]
bSmoothFrameRate=False
