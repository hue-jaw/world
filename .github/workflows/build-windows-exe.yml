# Construit METROPOLIS-<version>-win64.exe (portable) a chaque push du jeu,
# puis l'attache a une Release GitHub : lien de telechargement direct.
name: Build Windows EXE

on:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'web/**'
      - 'tools/**'
      - 'desktop/**'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write # requis pour creer la Release et y deposer le .exe

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Installer les dependances du jeu
        shell: bash
        run: cd web && npm ci

      - name: Empaqueter le jeu en un fichier
        shell: bash
        run: node tools/build_single_file.mjs

      - name: Installer les dependances desktop
        shell: bash
        run: cd desktop && npm install

      - name: Construire l'executable portable
        shell: bash
        run: cd desktop && npm run dist:win

      - name: Verifier la presence du binaire
        shell: bash
        run: ls -la desktop/release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: METROPOLIS-windows-x64
          path: desktop/release/*.exe
          retention-days: 90

      - name: Publier la Release (telechargement direct, sans compte)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v0.2.0"
          NOTES="Executable Windows portable (x64), sans installation."
          NOTES="$NOTES Double-cliquez : le jeu demarre dans sa propre fenetre (F11 plein ecran)."
          NOTES="$NOTES Contenu : quartier vivant, trafic IA avec feux, PNJ a routines,"
          NOTES="$NOTES 7 vehicules et 44 citoyens MODELISES en 3D (CC0), police et poursuites, missions,"
          NOTES="$NOTES cycle jour/nuit, meteo a effets gameplay, sauvegarde automatique."
          NOTES="$NOTES 100% hors-ligne, aucune installation, aucun droit administrateur."
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "METROPOLIS v0.2.0 - vertical slice jouable (modeles 3D)" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" desktop/release/*.exe --repo "$REPO" --clobber
          echo "Release : https://github.com/$REPO/releases/tag/$TAG"
